<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Theme Profile | Unique Learner</title>
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div class="profile-container">
        <header class="profile-header">
            <a id="homebtn"  href="Home.html"><button  >Home</button></a>

            <div class="user-info-main">
                <img id="profile-picture" src="pro.jpg" alt="Profile Picture">
                <h1 id="user-name">Loading User...</h1>
                <p id="user-title">Senior Frontend Developer | 🌟 Top 1% Learner</p>
            </div>
            <div class="stats-card">
                <div class="stat-item">
                    <i class="fas fa-certificate"></i>
                    <p id="certifications-count">0</p>
                    <span>Certifications</span>
                </div>
                <div class="stat-item">
                    <i class="fas fa-hourglass-half"></i>
                    <p id="hours-spent-count">0</p>
                    <span>Hours Spent</span>
                </div>
                <div class="stat-item">
                    <i class="fas fa-layer-group"></i>
                    <p id="projects-count">0</p>
                    <span>Projects Completed</span>
                </div>
            </div>
        </header>

        <section class="profile-content">
            
            <div class="skills-section">
                <h2>📈 Skill Ratings</h2>
                <div class="skills-list" id="skills-container">
                    </div>
            </div>

            <div class="badges-section">
                <h2>🏅 Mastery Badges</h2>
                <div class="badges-list" id="badges-container">
                    </div>
            </div>

            <div class="courses-section">
                <h2>📚 Active Courses</h2>
                <div class="courses-list" id="courses-container">
                    </div>
            </div>
        </section>
    </div>

    <script src="profile.js"></script>
</body>
</html>
