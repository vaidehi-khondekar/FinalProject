<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Learning Platform - Quiz & Leaderboard</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <div id="app">
        <header>
            <h1 id="Heading">🎓 Learning Platform</h1>
            <nav>
                <button onclick="showSection('dashboard')">Dashboard</button>
                <button onclick="showSection('leaderboard')">Leaderboard</button>
            </nav>
        </header>

        <section id="dashboard" class="content-section active">
            <h2>Dashboard & Stats</h2>
            <p>Welcome back, <strong id="current-username">User!</strong></p>
            <p>Total Quizzes Taken: <span id="stat-quizzes">0</span></p>
            <p>High Score: <span id="stat-high-score">0</span> / 5</p>
            <button id="start-quiz-btn" onclick="startQuiz()">🚀 Start New Quiz</button>
            <a href="Home.html"><button  >Home</button></a>
        </section>

        <section id="quiz-section" class="content-section">
            <h2>🧠 Quiz Challenge</h2>
            <div id="quiz-container">
                <p id="question-text">Question loading...</p>
                <div id="options-container">
                    </div>
            </div>
            <div id="quiz-status">
                Question <span id="current-q">1</span> of <span id="total-q">5</span>
            </div>
            <button id="next-question-btn" onclick="nextQuestion()" disabled>Next Question</button>
        </section>

        <section id="result-section" class="content-section">
            <h2>✅ Quiz Complete!</h2>
            <p>Your Score: <span id="final-score">0</span> / <span id="max-score">5</span></p>
            <p id="result-message"></p>
            <button onclick="showSection('dashboard')">Back to Dashboard</button>
            <button onclick="showSection('leaderboard')">View Leaderboard</button>
        </section>

        <section id="leaderboard" class="content-section">
            <h2>🏆 Global Leaderboard</h2>
            <table id="leaderboard-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>User</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </section>
    </div>


    <script src="script.js"></script>
</body>
</html>
