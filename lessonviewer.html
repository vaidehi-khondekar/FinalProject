<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EduVerse | Lesson Viewer</title>
<script src="Home.js"></script>
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #121212;
    color: #E0E0E0;
  }

  .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 3rem;
    background: #1E1E1E;
    box-shadow: 0 2px 8px rgba(74,144,226,0.2);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-weight: 700;
    font-size: 1.8rem;
    color: #50E3C2;
    letter-spacing: 1.2px;
    cursor: pointer;
    user-select: none;
  }
  .logo:hover {
    color: #4A90E2;
  }
  .navbar nav {
    display: flex;
    gap: 2rem;
  }
  .navbar nav a {
    color: #A0A0A0;
    font-weight: 600;
    font-size: 1rem;
    padding: 0.3rem 0.5rem;
    border-radius: 4px;
  }
  .navbar nav a:hover,
  .navbar nav a.active {
    color: #50E3C2;
    background: #2a2a2a;
  }

  .container {
    max-width: 900px;
    margin: 3rem auto;
    padding: 0 1.5rem;
  }

  h1 {
    color: #4A90E2;
    font-weight: 700;
    margin-bottom: 1rem;
  }

  /* Mock video player */
  .video-player {
    width: 100%;
    height: 400px;
    background: #222;
    border-radius: 14px;
    box-shadow: 0 0 20px rgba(74,144,226,0.25);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #50E3C2;
    font-size: 2rem;
    user-select: none;
    position: relative;
  }
  .video-player::before {
    content: '▶';
    font-size: 4rem;
    opacity: 0.3;
    position: absolute;
  }

  /* Quiz section */
  .quiz-section {
    margin-top: 2.5rem;
  }
  .quiz-section h2 {
    color: #4A90E2;
    font-weight: 700;
    margin-bottom: 1rem;
    border-bottom: 2px solid #50E3C2;
    padding-bottom: 0.5rem;
  }

  .quiz-question {
    margin-bottom: 1.2rem;
  }
  .quiz-question p {
    margin-bottom: 0.5rem;
  }
  .quiz-options label {
    display: block;
    background: #1F1F1F;
    padding: 10px 16px;
    border-radius: 10px;
    margin-bottom: 0.7rem;
    cursor: pointer;
    transition: background 0.3s ease;
  }
  .quiz-options label:hover {
    background: #4A90E2;
    color: #e0e0e0;
  }
  .quiz-options input[type="radio"] {
    margin-right: 10px;
    cursor: pointer;
  }
  .submit-btn {
    background: #50E3C2;
    border: none;
    padding: 12px 28px;
    font-weight: 700;
    border-radius: 30px;
    cursor: pointer;
    font-size: 1rem;
    color: #121212;
    transition: background 0.3s ease;
  }
  .submit-btn:hover {
    background: #4A90E2;
    color: #e0e0e0;
  }

  /* Result message */
  .result-message {
    margin-top: 1rem;
    font-weight: 700;
    font-size: 1.1rem;
  }
  .correct {
    color: #50E3C2;
  }
  .incorrect {
    color: #FF6B6B;
  }
  
  /* Navigation buttons */
  .lesson-nav {
    margin-top: 2rem;
    display: flex;
    justify-content: space-between;
  }
  .lesson-nav a {
    color: #50E3C2;
    text-decoration: none;
    font-weight: 600;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    background: #1E1E1E;
    box-shadow: 0 0 10px rgba(74,144,226,0.2);
    transition: background 0.3s ease;
  }
  .lesson-nav a:hover {
    background: #4A90E2;
    color: #e0e0e0;
  }
  .lesson-nav a.disabled {
    opacity: 0.4;
    pointer-events: none;
  }
</style>
</head>
<body>

<header class="navbar">
  <div class="logo" onclick="location.href='index.html'">Vislona</div>
  <nav>
    <a href="Home.html">Home</a>
    <a href="course.html">Courses</a>
  </nav>
</header>

<div class="container" id="lessonContent">
  <!-- Lesson content will be injected here -->
</div>

<script>
  // Mock lessons data by course
  const lessonsData = {
    "web-development": [
      {
        title: "Introduction to HTML",
        videoDesc: "Basics of HTML structure",
        quiz: {
          question: "What does HTML stand for?",
          options: [
            { text: "HyperText Markup Language", correct: true },
            { text: "Home Tool Markup Language", correct: false },
            { text: "Hyperlinks and Text Markup Language", correct: false }
          ]
        }
      },
      {
        title: "CSS Fundamentals",
        videoDesc: "Styling with CSS basics",
        quiz: {
          question: "Which property controls the text size?",
          options: [
            { text: "font-style", correct: false },
            { text: "text-size", correct: false },
            { text: "font-size", correct: true }
          ]
        }
      }
    ],
    "data-science": [
      {
        title: "Python for Data Science",
        videoDesc: "Introduction to Python programming",
        quiz: {
          question: "Which library is commonly used for data manipulation?",
          options: [
            { text: "NumPy", correct: false },
            { text: "Pandas", correct: true },
            { text: "Matplotlib", correct: false }
          ]
        }
      }
    ]
    // Add more courses & lessons here...
  };

  function getQueryParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
  }

  function renderLesson(courseId, lessonIndex) {
    const container = document.getElementById("lessonContent");
    const courseLessons = lessonsData[courseId];

    if (!courseLessons) {
      container.innerHTML = `<p>Course not found.</p>`;
      return;
    }
    if (lessonIndex < 0 || lessonIndex >= courseLessons.length) {
      container.innerHTML = `<p>Lesson not found.</p>`;
      return;
    }

    const lesson = courseLessons[lessonIndex];
    document.title = `Vislona | ${lesson.title}`;

    // Create quiz options HTML
    const quizOptionsHTML = lesson.quiz.options.map((opt, i) => `
      <label>
        <input type="radio" name="quiz" value="${i}" /> ${opt.text}
      </label>
    `).join("");

    // Calculate previous and next lesson indices
    const prevIndex = lessonIndex - 1;
    const nextIndex = lessonIndex + 1;

    container.innerHTML = `
      <h1>${lesson.title}</h1>
      <div class="video-player" aria-label="Mock video player for ${lesson.title}">
        ${lesson.videoDesc}
      </div>

      <section class="quiz-section">
        <h2>Quiz</h2>
        <form id="quizForm">
          <div class="quiz-question">
            <p>${lesson.quiz.question}</p>
            <div class="quiz-options">
              ${quizOptionsHTML}
            </div>
          </div>
          <button type="submit" class="submit-btn">Submit Quiz</button>
        </form>
        <div id="result" class="result-message"></div>
      </section>

      <div class="lesson-nav">
        <a href="?course=${courseId}&lesson=${prevIndex}" class="${prevIndex < 0 ? 'disabled' : ''}">← Previous Lesson</a>
        <a href="?course=${courseId}&lesson=${nextIndex}" class="${nextIndex >= courseLessons.length ? 'disabled' : ''}">Next Lesson →</a>
      </div>
    `;

    // Quiz functionality
    document.getElementById("quizForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const selectedOption = document.querySelector('input[name="quiz"]:checked');
      const resultDiv = document.getElementById("result");
      if (!selectedOption) {
        resultDiv.textContent = "Please select an answer.";
        resultDiv.className = "result-message incorrect";
        return;
      }

      const selectedIndex = parseInt(selectedOption.value, 10);
      const isCorrect = lesson.quiz.options[selectedIndex].correct;

      if (isCorrect) {
        resultDiv.textContent = "Correct! Well done.";
        resultDiv.className = "result-message correct";
      } else {
        resultDiv.textContent = "Incorrect. Try again!";
        resultDiv.className = "result-message incorrect";
      }
    });
  }

  // Read URL params and render lesson
  const courseId = getQueryParam('course') || 'web-development';
  const lessonIndex = parseInt(getQueryParam('lesson'), 10) || 0;
  renderLesson(courseId, lessonIndex);
</script>

</body>
</html>
